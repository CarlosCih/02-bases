<article class="card shadow-sm border-0 h-100">
  <div class="card-body p-4">
    <h2 class="h4 mb-4">Agregar personaje</h2>

    <form class="d-grid gap-3">
      <div>
        <label for="name" class="form-label fw-semibold">Nombre</label>
        <input class="form-control form-control-lg" id="name" type="text" placeholder="Nombre del personaje"
          [value]="name()" (change)="name.set($event.target.value)" (input)="name.set($event.target.value)" />
      </div>

      <div>
        <label for="power" class="form-label fw-semibold">Poder {{power()}}</label>
        <input class="form-control form-control-lg" id="power" type="number" placeholder="Nivel de poder"
          [value]="power()" (change)="power.set(powerInput.valueAsNumber)" #powerInput />
      </div>
      <button class="btn btn-primary btn-lg mt-2" type="button" (click)="addCharacter()">Agregar</button>
    </form>
  </div>
</article>
